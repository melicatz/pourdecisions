<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://wineandonly.netlify.app/">
<title>Pour Decisions has moved</title>
<script>
  // Remove the old installed app's service worker + caches so devices follow
  // the move instead of serving the retired version from cache.
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  } catch (e) {}
  location.replace('https://wineandonly.netlify.app/');
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #170a0e; color: #f3e7df;
         display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; }
  a { color: #dcb551; }
</style>
</head>
<body>
  <p>Pour Decisions has moved to<br><a href="https://wineandonly.netlify.app/">wineandonly.netlify.app</a></p>
</body>
</html>
